version: 2

project_name: t3-steward

before:
  hooks:
    - go mod tidy

builds:
  - id: t3-steward
    main: ./cmd/t3-steward
    binary: t3-steward
    env:
      - CGO_ENABLED=0
    # Windows left the matrix in 0.11.0: the backlog runtime relies on flock
    # and unix stat, and no host in the fleet runs it there.
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - config.example.yaml
      - packaging/systemd/t3-steward.service
      - packaging/opencode/steward-session.js
      - docs/t3-protocol.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  prerelease: auto
  draft: false
  footer: |
    ## Verify a download

    ```sh
    sha256sum -c --ignore-missing checksums.txt
    ```

    Tested T3 Code versions are listed in the README compatibility table.
