version: 2
name: c1
class: required
environment:
  project: t3-steward-github
  ref: d2e827681336e76413fdab34392f029a3e131cf4
inputs:
  - inputs/plan.md
  - inputs/unit.md
tasks:
  implement:
    routes:
      - instance: claudeAgent
        model: claude-opus-5-5
        quota_pool: claude-main
        options: {effort: medium}
    prompt_file: prompts/implement.md
    outputs: [continuation.md, handoff.md]
    commits:
      - name: implementation
        revision: HEAD
    verify:
      - go test ./...
      - git diff --check
  review:
    routes:
      - instance: codex
        model: gpt-6.1-sol
        quota_pool: codex-main
        options: {effort: high}
    prompt_file: prompts/review.md
    needs: [implement]
    inputs_from:
      implement:
        - implementation
        - handoff.md
    outputs: [continuation.md, review.md]
    review_output:
      verdict_line: review.md
