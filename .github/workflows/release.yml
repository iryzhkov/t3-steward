name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA reachable from main
        required: true
        type: string
      version:
        description: New version tag (v*)
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  goreleaser:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Resolve release commit and version
        id: target
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_dispatch ]]; then
            [[ "$INPUT_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Full commit SHA required: $INPUT_SHA" >&2; exit 1; }
            sha="${INPUT_SHA,,}"
            version="$INPUT_VERSION"
            [[ "$version" == v* ]] || { echo "Version must start with v" >&2; exit 1; }
            git check-ref-format "refs/tags/$version"
            if git show-ref --verify --quiet "refs/tags/$version"; then
              echo "SHA $sha: tag $version already exists" >&2
              exit 1
            fi
            [[ "$(git cat-file -t "$sha")" == commit ]]
          else
            sha="$(git rev-parse HEAD)"
            version="$GITHUB_REF_NAME"
          fi
          git fetch origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main || {
            echo "SHA $sha is not reachable from main" >&2
            exit 1
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Keep the gate from this workflow checkout when releasing older SHAs.
          go build -o "$RUNNER_TEMP/release-ci" ./scripts/release-ci
      - name: Wait for exact push CI on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ steps.target.outputs.sha }}
        run: '"$RUNNER_TEMP/release-ci" --repo "$REPOSITORY" --sha "$SHA" --timeout 30m'
      - name: Checkout accepted commit and create dispatch tag
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ steps.target.outputs.sha }}
          VERSION: ${{ steps.target.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$SHA"
          if [[ "$EVENT" == workflow_dispatch ]]; then
            git tag "$VERSION" "$SHA"
            # No force: a concurrent train creating the same tag must fail.
            git push origin "refs/tags/$VERSION:refs/tags/$VERSION"
          fi
      # GITHUB_TOKEN tag pushes do not start another workflow; publish here.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.target.outputs.version }}
      - name: Verify every published asset against checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.target.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          assets="$(mktemp -d "$RUNNER_TEMP/release-assets.XXXXXX")"
          gh release download "$VERSION" --dir "$assets"
          "$RUNNER_TEMP/release-ci" --assets-dir "$assets"
